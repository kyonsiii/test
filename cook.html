<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css?v202607011933" rel="stylesheet"/>
        <script src="js/main.js?v202607011933"></script>
        <script src="js/recipedb.js?v202607011933"></script>
        <script src="js/pokeCook.js?v202607011933"></script>
        <script src="js/pokedex_data_poke.js?v202607011933"></script>
        <script src="js/pokedex_data_skill.js?v202607011933"></script>
        <script src="js/pokedex_data_etc.js?v202607011933"></script>
        <script src="js/pokedex2.js?v202607011933"></script>
        <title>料理v202607011933</title>
    </head>


    <body>
        <div id="page_link">
            <a href = "./index.html"><img src="img/pages/pokedex.png"></a>
            <a href = "./sleep.html"><img src="img/pages/sleep.png"></a>
            <a href = "./cook.html" class ="current"><img src="img/pages/cook.png"></a>            
            <a href = "./report.html"><img src="img/pages/report.png"></a>
            <a href = "./event.html"><img src="img/pages/event.png"></a>
        </div>

        <div id="recipe_filter">
            <div id="current_recipe_type" class="select_button_area">             
                <input type="radio" name="recipe_type" onclick="pokeCook.setTarget(this, this)" id="filter_all" value="all" checked><label for="filter_all">ALL</label>
                <input type="radio" name="recipe_type" onclick="pokeCook.setTarget(this, this)" id="filter_cur" value="カレー・シチュー"><label for="filter_cur"><img src="img/recipe/curry.png"></label>
                <input type="radio" name="recipe_type" onclick="pokeCook.setTarget(this, this)" id="filter_sal" value="サラダ"><label for="filter_sal"><img src="img/recipe/salad.png"></label>
                <input type="radio" name="recipe_type" onclick="pokeCook.setTarget(this, this)" id="filter_des" value="デザート・ドリンク"><label for="filter_des"><img src="img/recipe/sweet.png"></label>               
            </div>

            <br>

            <div id="recipe_limit">
                <input type="radio" id="recipe_limit_nolimit" name="recipe_limit" onchange="pokeCook.setTarget(this, null)" value="9999" checked>制限なし<br>                
                <input type="text" id="recipe_limit_manual" style="width:3em;">個
                <input type="radio" id="recipe_limit_more" name="recipe_limit" onchange="pokeCook.setTarget(this, null)" value="more" checked>以上
                <input type="radio" id="recipe_limit_less" name="recipe_limit" onchange="pokeCook.setTarget(this, null)" value="less">以下                   
            </div>   

            <div id="food_buttons" style="margin-top: 0.1em;">
            </div>
        </div>


        <div>
            <button onclick="pokeCook.showWeekendSchedule();">料理の材料一覧を表示</button>           
            <table id="weekend">
                <tbody>
                </tbody>
            </table>


            <strong style="white-space: nowrap" id="bonus_info">レシピLv--、フィールドBonus+--%で計算</strong>
            <table id="recipe_table">
                <tbody>
                </tbody>
            </table>
        </div>
        <span style="background-color: lightblue;" ondblclick="pokeCook.recalcRecipeInfo75();">
            ダブルクリックでBonus75%で表示
        </span>


        <!--以下、スクリプト-->
        <script>
            function selectIcon(el){
                if (el == null){
                    Array.from(document.getElementById('berry_buttons').children).forEach(c => this.changeIconStyle(c, false));
                    Array.from(document.getElementById('food_buttons').children).forEach(c => this.changeIconStyle(c, false));
                }
                else if (el.style.margin == "" || el.style.margin == "4px"){
                    el.style.margin = "0px";
                    el.style.border = "4px solid blue";
                    el.classList.add("selected");
                }
                else{
                    el.style.margin = "4px";
                    el.style.border = "";
                    el.classList.remove("selected");
                }
            }
            window.onload = ()=>{
                this.pokedex = new Pokedex();
                this.recipedb = new RecipeDB();
                this.pokeCook = new PokeCook(this.recipedb.recipes);
                this.pokeCook.setTableRows(true);                  
                this.pokeCook.setOptionsFromCookie(getCookie("cinf")); 
                document.getElementById("food_buttons").innerHTML = pokedex.foodList.map(f => `<img name="${f.name}" src="img/food/${f.name}.png" onclick="selectIcon(this); pokeCook.setTarget(this, null)">`).join("");
                
            }

        </script>


    </body>

</html>
