<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css?v202608100550" rel="stylesheet"/>
        <script src="js/main.js?v202608100550"></script>
        <script src="js/pokeSearch.js?v202608100550"></script>
        <script src="js/pokedex_data_poke.js?v202608100550"></script>
        <script src="js/pokedex_data_skill.js?v202608100550"></script>
        <script src="js/pokedex_data_poke_field.js?v202608100550"></script>
        <script src="js/pokedex_data_etc.js?v202608100550"></script>
        <script src="js/pokedex2.js?v202608100550"></script>
        

        <title>ポケモンスリープアプリv202608100550</title>

    </head>


    <body>
        <div id="page_link">
            <a href = "./index.html" class ="current"><img src="img/pages/pokedex.png"></a>
            <a href = "./sleep.html"><img src="img/pages/sleep.png"></a>
            <a href = "./cook.html"><img src="img/pages/cook.png"></a>            
            <a href = "./report.html"><img src="img/pages/report.png"></a>
            <a href = "./event.html"><img src="img/pages/event.png"></a>
        </div>

        <p>
            <div id="pokesearch_filter">
                <select id="select_specialty" onchange="pokesearch.setResult();">
                    <option value = "----">----</option>
                    <option value = "スキル">スキル</option>
                    <option value = "きのみ">きのみ</option>
                    <option value = "食材">食材</option>
                </select>
                <select id="select_sleeptype" onchange="pokesearch.setResult();">
                    <option value = "----">----</option>
                    <option value = "うとうと">うとうと</option>
                    <option value = "すやすや">すやすや</option>
                    <option value = "ぐっすり">ぐっすり</option>
                </select>
                <br>
                    
                <select id="select_skill">
                </select>
                <br>

                <input type="checkbox" id="option_only_fully_evolved" onchange="pokesearch.setResult();" checked><label for="option_only_fully_evolved">最終進化のみ表示</label>
                <input type="checkbox" id="option_ignore_detail" onchange="pokesearch.setResult();"><label for="option_ignore_detail">詳細情報の非表示</label>
                <button id="button_reset" onclick="pokesearch.reset();">リセット</button>
            </div>




    

    

            <div id="field_buttons">
                <!--nameの後に変なスペースあるのは狙ってやっているので注意-->
                <img name="ワカクサ本島 " src="img/field/ワカクサ.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="シアンの砂浜 " src="img/field/シアン.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="トープ洞窟 " src="img/field/トープ.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="ウノハナ雪原 " src="img/field/ウノハナ.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="ラピスラズリ湖畔 " src="img/field/ラピス.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="ゴールド旧発電所 " src="img/field/ゴールド.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="アンバー渓谷 " src="img/field/アンバー.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <br>
                <img name="ワカクサ本島 EX " src="img/field/ワカクサEX.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
                <img name="シアンの砂浜 EX " src="img/field/シアンEX.png" class="fieldIcon" onclick="pokesearch.selectIcon(this)">
            </div>


            <div id="berry_buttons">

            </div>

            <div id="food_buttons">
            </div>
            
            <table id="result">
                <thead>
                    <tr>
                        <th>ポケモン</th>
                        <th>詳細</th>
                    </tr>
                </thead>
                <tbody id="result_rows">
    
                </tbody>
            </table>
        </p>





        <!--以下、スクリプト-->
        <script>
            window.onload = ()=>{
                this.pokedex = new Pokedex();
                this.pokesearch = new PokeSearch();
                this.pokesearch.initialize(this.pokedex);
                this.pokesearch.setSkillListTo(document.getElementById("select_skill"));
                document.getElementById("food_buttons").innerHTML = pokedex.foodList.map(f => `<img name="${f.name}" src="img/food/${f.name}.png" onclick="pokesearch.selectIcon(this)">`).join("");
                document.getElementById("berry_buttons").innerHTML = pokedex.berryList.map(b => `<img name="${b.name}" src="img/berry/${b.name}.png" onclick="pokesearch.selectIcon(this)">`).join("");
                //test
            }
        </script>
    </body>

</html>
